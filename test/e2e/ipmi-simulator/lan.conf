name "IPMI-SIM-SERVER"

set_working_mc 0x20

  startlan 1
    addr 0.0.0.0 623
    priv_limit admin
    allowed_auths_admin md5
    guid a123456789abcdefa123456789abcdef
  endlan

  chassis_control "/usr/local/bin/ipmi_sim_chassiscontrol 0x20"
  sol "/dev/vtty" 115200
  user 2 true "ADMIN" "ADMIN" admin 10 md5
